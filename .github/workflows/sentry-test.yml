name: "Sentry Test"

# Manual / CI-only quick test for the SENTRY_AUTH_TOKEN secret.
# Triggers via workflow_dispatch in Actions UI.
on:
  workflow_dispatch: {}

jobs:
  sentry-test:
    name: Validate Sentry auth (fast)
    runs-on: ubuntu-latest
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install sentry-cli
        run: npm install -g @sentry/cli

      - name: Validate SENTRY_AUTH_TOKEN present
        run: |
          if [ -z "${SENTRY_AUTH_TOKEN}" ]; then
            echo "ERROR: SENTRY_AUTH_TOKEN secret is not set. Add it under Settings → Secrets and variables → Actions.";
            exit 1;
          fi

      - name: Verify sentry-cli version
        run: sentry-cli --version

      - name: Test Sentry auth and list orgs
        run: |
          echo "Running sentry-cli info"
          sentry-cli --log-level=info info
          echo "Listing organizations"
          sentry-cli --log-level=info organizations list

      - name: List projects for JoMarket org (if available)
        run: |
          sentry-cli --log-level=info projects list --org jomarket || echo "projects list failed (check token scopes)"
