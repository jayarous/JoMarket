---
name: CI

on:
  workflow_dispatch: {}
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secrets-check:
    name: Check required secrets
    runs-on: ubuntu-latest
    outputs:
      secrets-ok: ${{ steps.verify.outputs.secrets_ok }}
    steps:
      - name: Verify required secrets are set
        id: verify
        run: |
          missing=()
          if [ -z "${{ secrets.SUPABASE_KEY }}" ]; then missing+=(SUPABASE_KEY); fi
          if [ -z "${{ secrets.SUPABASE_URL }}" ]; then missing+=(SUPABASE_URL); fi
          if [ -z "${{ secrets.STRIPE_SECRET_KEY }}" ]; then missing+=(STRIPE_SECRET_KEY); fi
          if [ ${#missing[@]} -ne 0 ]; then
            echo "Missing required secrets: ${missing[*]}"
            echo "::set-output name=secrets_ok::false"
            exit 1
          else
            echo "All required secrets present"
            echo "::set-output name=secrets_ok::true"
          fi

  build:
    needs: [secrets-check]
    runs-on: ubuntu-latest
    env:
      # Expose secrets into the build environment so flutter/test can use them.
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pin a concrete Flutter SDK release that includes a Dart SDK compatible
          # with our pubspec (Dart >= 3.9.2). We'll try Flutter 4.0.0 first.
          flutter-version: '4.0.0'

      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}

      - name: Install dependencies
        run: flutter pub get

      - name: Export secrets to local env file
        run: |
          # Create env directory if missing and export CI secrets to env/.env for processes that load dotenv.
          mkdir -p env || true
          bash ./scripts/export_env_from_secrets.sh env/.env || true

      - name: Dart format check
        run: dart format --output=none --set-exit-if-changed .

      - name: Static analysis
        run: flutter analyze

      - name: Run unit & widget tests
        run: flutter test --coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
